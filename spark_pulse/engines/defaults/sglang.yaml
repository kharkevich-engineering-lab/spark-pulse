schema_version: "1"
engine: sglang
variant: default
description: SGLang for DGX Spark, wrapping the upstream cu130 image with tiktoken files and Spark defaults.
image: ghcr.io/kharkevich-engineering-lab/spark-pulse-engine/sglang
version: 0.1.0
legacy_tags: []
arch: [linux/arm64]
gpu_arch: ["12.1a"]

sources:
  sglang: {image: lmsysorg/sglang:v0.5.10.post1-cu130}

runtime:
  python: "3.12"
  workdir: /workspace
  serve: python3 -m sglang.launch_server
  model_arg: --model-path
  readiness: /health
  models_endpoint: /v1/models
  metrics: /metrics
  ports: {api: 30000, rendezvous: 50000}
  # ~/tiktoken_encodings is mounted at /root/tiktoken_encodings; gpt-oss needs
  # the encoding files offline, and an empty directory costs nothing otherwise.
  cache_mounts: [~/.cache/huggingface, ~/tiktoken_encodings]
  env:
    HF_HOME: /root/.cache/huggingface
    TIKTOKEN_ENCODINGS_BASE: /root/tiktoken_encodings
    NCCL_IB_DISABLE: "0"
    NCCL_NET_GDR_LEVEL: "5"
    NCCL_TIMEOUT: "1200000"
  container:
    privileged: false
    ipc_host: true
    network_host: true
    shm_size_gb: 32
    devices: [/dev/infiniband]
    ulimits: {memlock: "-1", stack: "67108864"}
    keepalive: sleep infinity
  multi_node:
    # Multi-node only: FlashInfer's all-reduce fusion uses CUDA IPC, which
    # fails across nodes with "invalid device context". Solo must not carry it.
    style: sglang
    extra_args: [--enable-dp-attention]
  param_flags:
    port: --port
    host: --host
    tensor_parallel: --tp
    pipeline_parallel: --pp-size
    gpu_memory_utilization: --mem-fraction-static
    max_model_len: --context-length
    max_num_seqs: --max-running-requests

capabilities: {mods: false, pr_mods: false, solo: true, cluster: true, mesh: false}
verified:
  - {nodes: 1, tp: 1, model: Qwen/Qwen2.5-0.5B-Instruct, date: "2026-09-03", notes: "scripts/smoke-test.sh on GB10 (driver 580.159.03), image 0.1.0 digest f0660987, sglang 0.5.10.post1 torch 2.9.1+cu130; ready in 50s, chat completion ok"}
  - {nodes: 1, tp: 1, model: meta-llama/Llama-3.1-8B-Instruct, date: "2026-05-01", notes: "mark-ramsey-ri/sglang-dgx-spark, same base image"}
  - {nodes: 2, tp: 2, model: meta-llama/Llama-3.1-8B-Instruct, date: "2026-05-01", notes: "mark-ramsey-ri/sglang-dgx-spark, needs --enable-dp-attention"}
