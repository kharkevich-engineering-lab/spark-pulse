auth_enabled: false
benchmarking_enabled: false
cluster_enabled: false
# Multi-node orchestration has never been exercised on real hardware, so the UI
# labels it experimental. Flip this once a two-node bring-up has been verified.
cluster_experimental: true
default_container: vllm-node
job_retention_days: 7
# Deployment runtime: "upstream" forks spark-vllm-docker's run-recipe.sh,
# "native" drives Docker from Python via the engine registry (solo only).
runtime: upstream
deploy_ready_timeout_seconds: 900
# Seconds of silence from a docker pull before it is failed rather than
# left holding a worker thread. 0 disables the watchdog.
docker_pull_stall_timeout_seconds: 300
# Worker threads for sync request handlers (anyio's default limiter).
thread_pool_size: 40
default_gpu_mem_util: 0.8
default_port_range_end: 9100
default_port_range_start: 9000
model_sources:
  - name: hf
    type: hf_hub
    endpoint: https://huggingface.co
    token_secret: hf_token
mcp_enabled: true
mcp_path: /mcp
mcp_api_token: ""
oidc_client_id: ""
oidc_client_secret: ""
oidc_provider_url: ""
spark_vllm_path: /tmp/spark-vllm-docker
webui_port: 8100
oci_auto_update_enabled: false
oci_auto_update_schedule: "0 2 * * *"
oci_auto_update_overwrite_local: false
oci_cache_ttl_seconds: 300
oci_background_check_interval_seconds: 900
docker:
  privileged: true
  memory_limit_gb: 110
  memory_swap_limit_gb: null
  pids_limit: 4096
  shm_size_gb: 64
  nofile_limit: 1048576
  cache_dirs:
    - ~/.cache/vllm
    - ~/.cache/flashinfer
    - ~/.triton
  keep_entrypoint: false
nccl:
  debug: null
  socket_ifname: null
  ib_hca: null

# ── Engines ──────────────────────────────────────────────────────────────────
default_engine: vllm
engine_indexes:
  - ghcr.io/kharkevich-engineering-lab/spark-pulse-engine/index:latest
engine_index_cache_ttl_seconds: 3600
engines:
  vllm:
    enabled: true
  sglang:
    enabled: true
