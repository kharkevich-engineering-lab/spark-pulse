<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Pulse</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='none' stroke='%232563eb' stroke-width='32' stroke-linecap='round' stroke-linejoin='round'><polyline points='48 320 112 320 176 64 240 448 304 224 336 320 400 320'/><circle cx='432' cy='320' r='32'/></svg>" />
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        var mode = localStorage.getItem('spark-pulse-theme') || 'system';
        var isDark;
        if (mode === 'system') {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDark = mode === 'dark';
        }
        document.documentElement.className = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body class="bg-bg text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
