[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# ── Project metadata ────────────────────────────────────────────────────────

[project]
name = "spark-pulse"
version = "1.2.3"
description = "Web UI for spark-vllm-docker — recipe management, deployment, and monitoring for DGX Spark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
    "authlib>=1.3.0",
    "httpx>=0.28.0",
    "filelock>=3.12.0",
    "oras>=0.2.0",
    "docker>=7.0.0",
    "huggingface_hub>=0.26.0",
    # Peer discovery over mDNS. Tested on the Spark against a running
    # avahi-daemon in both directions; see docs/cluster-agent-plan.md §6.
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.6.0",
    "httpx>=0.28",
    "oidc-provider-mock>=0.4.0",
    "jsonschema>=4.20",
]
mcp = [
    "mcp>=1.0.0",
]
benchmarking = [
    "llama-benchy>=0.1.0",
]

[[project.maintainers]]
name = "Alexander Kharkevich"
email = "alex@kharkevich.org"

[project.urls]
homepage = "https://github.com/kharkevich-engineering-lab/spark-pulse"
repository = "https://github.com/kharkevich-engineering-lab/spark-pulse"

# ── Console script ──────────────────────────────────────────────────────────

[project.scripts]
spark-pulse = "spark_pulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -v"
env = ["SIMULATION_MODE=1"]
asyncio_mode = "auto"

# ── Packaging ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["spark_pulse*", "spark_pulse.*"]

[tool.setuptools.package-data]
spark_pulse = [
    "ui/**/*",
    "service/templates/**/*",
    "registries.yaml",
    "engines/defaults/*.yaml",
    "recipes/*.yaml",
    "schemas/*.json",
]
