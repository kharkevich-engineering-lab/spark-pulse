[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# ── Project metadata ────────────────────────────────────────────────────────

[project]
name = "spark-pulse"
version = "1.2.3"
description = "Web UI for spark-vllm-docker — recipe management, deployment, and monitoring for DGX Spark"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
    "authlib>=1.3.0",
    "httpx>=0.28.0",
    "filelock>=3.12.0",
    "oras>=0.2.0",
    "docker>=7.0.0",
    "huggingface_hub>=0.26.0",
    # Peer discovery over mDNS. Tested on the Spark against a running
    # avahi-daemon in both directions; see docs/cluster-agent-plan.md §6.
    "zeroconf>=0.132.0",
    # The node agent's transport. One long-lived bidirectional stream per node
    # (docs/cluster-agent-plan.md §3.2), so this is core rather than optional:
    # every node in a cluster is reached through it, the control node included.
    # The floor is the version the committed stubs were generated against —
    # spark_pulse/agent/agent_pb2_grpc.py refuses to import an older grpcio,
    # and spark_pulse/agent/agent_pb2.py an older protobuf runtime.
    "grpcio>=1.83.1",
    "protobuf>=7.35.1",
    # The CA, the CSRs and the SPIFFE names (§3.2). Already an indirect
    # dependency through authlib; named here because this package imports it
    # directly and must not be at the mercy of another package's pin.
    "cryptography>=42.0",
    # The SSH bootstrap installer (§3.1). In-process rather than an `ssh`
    # subprocess, because the node password must never become an argv entry
    # and `sshpass` is explicitly ruled out. Imported lazily inside
    # spark_pulse/agent/bootstrap_transport.py, so a control plane that never
    # installs an agent still starts without it.
    "asyncssh>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.6.0",
    "httpx>=0.28",
    "oidc-provider-mock>=0.4.0",
    "jsonschema>=4.20",
    # protoc and the gRPC plugin, for scripts/generate-proto.sh. Not needed to
    # install or run spark-pulse: the stubs it emits are committed.
    "grpcio-tools>=1.83.1",
]
mcp = [
    "mcp>=1.0.0",
]
benchmarking = [
    "llama-benchy>=0.1.0",
]

[[project.maintainers]]
name = "Alexander Kharkevich"
email = "alex@kharkevich.org"

[project.urls]
homepage = "https://github.com/kharkevich-engineering-lab/spark-pulse"
repository = "https://github.com/kharkevich-engineering-lab/spark-pulse"

# ── Console script ──────────────────────────────────────────────────────────

[project.scripts]
spark-pulse = "spark_pulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -v"
env = ["SIMULATION_MODE=1"]
asyncio_mode = "auto"

# ── Packaging ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["spark_pulse*", "spark_pulse.*"]

[tool.setuptools.package-data]
spark_pulse = [
    "ui/**/*",
    "service/templates/**/*",
    "config.yaml",
    "registries.yaml",
    "engines/defaults/*.yaml",
    "recipes/*.yaml",
    "schemas/*.json",
    # The protocol definition travels with the package. The generated stubs
    # are ordinary modules and are picked up as code; this is so an operator
    # debugging a node can read the contract on the node.
    "agent/*.proto",
    "agent/*.pyi",
    # The node agent binary. One static file per target triple, built by
    # scripts/build-agent.sh and shipped as data — never imported here, and
    # never for this machine's platform: it is cargo for a *node*. The wheel
    # therefore stays `py3-none-any`, because tagging it for the node's
    # architecture would make it uninstallable on a control plane that is not
    # itself a Spark, which is backwards.
    "agent/bin/spark-pulse-agent-*",
]

# ── Formatting and linting ──────────────────────────────────────────────────

# The protobuf stubs under spark_pulse/agent/ are generated by protoc and
# regenerated by scripts/generate-proto.sh. Reformatting them would be undone
# by the next regeneration, and linting somebody else's code generator is not
# a useful signal. The .proto file is the source; these are build output that
# happens to be committed so an install needs no protoc.

[tool.black]
force-exclude = "spark_pulse/agent/agent_pb2(_grpc)?\\.pyi?$"

[tool.ruff]
extend-exclude = ["spark_pulse/agent/agent_pb2.py", "spark_pulse/agent/agent_pb2_grpc.py", "spark_pulse/agent/agent_pb2.pyi"]
