name: Unit tests
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  python-unit-tests:
    name: Run Python unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
            .agent-build-cache
          key: agent-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: agent-${{ runner.os }}-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Two binaries, for two different jobs.
      #
      # The bundle ships aarch64-musl — the node's platform, whatever this
      # runner is — and the bootstrap and bundle suites need a real one:
      # substituting a host binary under that name would let a packaging bug
      # through while every test stayed green.
      #
      # The control node runs an agent of its *own*, and that one has to run
      # here, so it is a plain host build. Without either, ~85 tests skip
      # rather than fail, which is the quietest way for a suite to stop
      # testing anything.
      - name: Build the node agent (aarch64, for the bundle)
        run: ./scripts/build-agent.sh
      - name: Build the node agent (host, for the control node)
        run: cargo build --release
        working-directory: agent
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python tests
        run: |
          pytest --tb=short -v tests/
        env:
          SPARK_PULSE_REQUIRE_RUST: "1"

  ui-unit-tests:
    name: Run UI unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend build
        working-directory: web
        run: npm run build
      - name: Run UI unit tests
        working-directory: web
        run: npm run test:run

  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start mock backend for Playwright
        run: |
          SIMULATION_MODE=1 uvicorn spark_pulse.app:app --host 0.0.0.0 --port 8100 --workers 1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8100/health && break; sleep 1; done || exit 1
      - name: Run Playwright e2e tests
        working-directory: web
        run: npm run test:e2e
  rust-agent:
    name: Run node agent tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: agent
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: agent
      - name: Run Rust tests
        run: cargo test
        working-directory: agent

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the linters to the versions in .pre-commit-config.yaml so CI
          # and the pre-commit hook agree on what "clean" means.
          pip install -e ".[dev]" "ruff==0.12.0" "black==25.1.0"
          cd web && npm ci && cd ..

      - name: Run Python linters
        run: |
          black --check --diff tests/ spark_pulse/
          ruff check tests/ spark_pulse/

      - name: Run frontend ESLint
        run: |
          cd web && npx eslint src/ && cd ..

      - name: Run TypeScript type check
        run: |
          cd web && npx tsc --noEmit && cd ..
