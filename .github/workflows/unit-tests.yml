name: Unit tests
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  unit-tests:
    name: Run Unit testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend build
        working-directory: web
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python tests
        run: |
          pytest --tb=short -v tests/
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
          cd web && npm ci && cd ..

      - name: Run Python linters
        run: |
          black --check --diff tests/ spark_pulse/
          ruff check tests/ spark_pulse/

      - name: Run frontend ESLint
        run: |
          cd web && npx eslint src/ && cd ..

      - name: Run TypeScript type check
        run: |
          cd web && npx tsc --noEmit && cd ..
