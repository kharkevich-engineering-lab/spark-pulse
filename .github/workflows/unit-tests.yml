name: Unit tests
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  python-unit-tests:
    name: Run Python unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
            .agent-build-cache
          key: agent-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: agent-${{ runner.os }}-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The agent, for *this* machine. The control node runs one of its own,
      # and the bundle and installer suites build a bundle around it — nothing
      # in them executes the payload, so a host binary is the honest article
      # rather than a stand-in, and a cross-build here would be a
      # fifteen-minute emulated compile on every run. What ships to a node is
      # built and checked by the `agent-release-build` job below.
      #
      # Without this, ~85 tests skip rather than fail, which is the quietest
      # way for a suite to stop testing anything.
      - name: Build the node agent
        run: cargo build --release
        working-directory: agent
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python tests
        run: |
          pytest --tb=short -v tests/
        env:
          SPARK_PULSE_REQUIRE_RUST: "1"

  # The same suite, a second time, against a real PostgreSQL.
  #
  # spark_pulse/db.py goes through SQLAlchemy rather than the sqlite3 driver
  # for one reason: so that one appliance becoming several is a change to a
  # URL. Until this job existed the only evidence for that claim was
  # test_every_table_emits_postgresql_ddl, which compiles the schema for the
  # PostgreSQL dialect with no server behind it — it proves the column types
  # are portable and nothing at all about whether the queries run. The day
  # somebody set SPARK_PULSE_DATABASE_URL would have been the day the rest
  # was found out.
  python-unit-tests-postgres:
    name: Run Python unit tests against PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: spark_pulse
        ports:
          - 5432:5432
        # Without the health check the first connection races initdb and the
        # job fails on a connection refused that has nothing to do with the
        # change under test — the flake that teaches people to re-run CI.
        options: >-
          --health-cmd "pg_isready -U pulse -d spark_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # tests/conftest.py reads this once: anything that is not a SQLite URL
      # means "that server, cleaned between tests" instead of a private file
      # per test. Setting it is the entire difference between this job and the
      # one above, which is the point being demonstrated.
      SPARK_PULSE_DATABASE_URL: postgresql+psycopg://pulse:pulse@127.0.0.1:5432/spark_pulse
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [postgres] is psycopg, the driver the URL above names. Installing
          # it here also keeps the extra honest: an extra nothing installs is
          # an extra that has stopped resolving without anyone noticing.
          pip install -e ".[dev,postgres]"
      # No Rust toolchain here, unlike the job above: what the ~85 agent-binary
      # tests would add on PostgreSQL is enrolment writes that the stub-based
      # enrolment tests in test_agent_bootstrap.py already make, and the price
      # is a second full agent compile on every run. They skip, and the job
      # above is where they run.
      - name: Run Python tests
        run: |
          pytest --tb=short -v tests/
      # A suite that quietly ignored the URL would pass this job while proving
      # nothing, which is the exact failure this job exists to end. The tables
      # are created once and emptied between tests, never dropped, so after a
      # real run the server holds every one of them; after a run that fell
      # back to SQLite it holds none.
      - name: Confirm the suite really ran on PostgreSQL
        # The same import environment as the suite: a model module that failed
        # to import here would shrink the list of tables being looked for, and
        # a check that silently asks for less is worse than none.
        env:
          SIMULATION_MODE: "1"
        run: |
          python - <<'PY'
          import os
          import tempfile

          from sqlalchemy import create_engine, inspect

          from spark_pulse import db

          url = os.environ["SPARK_PULSE_DATABASE_URL"]

          # engine() imports every model module, which is how the full set of
          # tables is learned here without repeating the list — a table added
          # later is covered by this check on the day it is added. Against a
          # throwaway SQLite file, so that learning it cannot itself be what
          # creates them on the server.
          db.configure(f"sqlite:///{tempfile.mkdtemp()}/probe.db")
          db.engine()
          expected = {table.name for table in db.Base.metadata.sorted_tables}

          found = set(inspect(create_engine(url)).get_table_names())
          missing = expected - found
          if missing:
              raise SystemExit(
                  f"the run never created {sorted(missing)} on the PostgreSQL "
                  f"server, so it did not run against it. Found: "
                  f"{sorted(found) or 'nothing at all'}."
              )
          print(f"{len(expected)} tables were created on PostgreSQL by the run")
          PY

  ui-unit-tests:
    name: Run UI unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend build
        working-directory: web
        run: npm run build
      - name: Run UI unit tests
        working-directory: web
        run: npm run test:run

  # The browser suite, once per storage backend.
  #
  # The unit suite already runs every router test against a real PostgreSQL,
  # so what a second browser run adds is not "do the queries work" — it is the
  # part a TestClient never reaches: the application's *startup* against a
  # server (lifespan, schema creation, `reconcile_all`, the scheduled-deploy
  # reconcile) and its behaviour under a real connection pool serving
  # concurrent requests from a browser. Those are exactly the paths that fail
  # on the day somebody first sets SPARK_PULSE_DATABASE_URL, and until now
  # nothing exercised them.
  e2e-tests:
    name: Run E2E tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      # Both legs always run: a failure on one backend and not the other is
      # the single most useful thing this job can tell us, and fail-fast would
      # throw exactly that away.
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            database_url: ""
          - backend: postgresql
            database_url: postgresql+psycopg://pulse:pulse@127.0.0.1:5432/spark_pulse
    services:
      # Started for both legs — a service cannot be declared per-matrix-value.
      # postgres:16-alpine costs a few seconds to pull and the SQLite leg
      # simply never connects to it, which is cheaper than splitting this into
      # two near-identical jobs that then drift apart.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: spark_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d spark_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start mock backend for Playwright
        env:
          # Empty on the SQLite leg, which is what `config.database_url`
          # already treats as "use the default file".
          SPARK_PULSE_DATABASE_URL: ${{ matrix.database_url }}
        run: |
          SIMULATION_MODE=1 uvicorn spark_pulse.app:app --host 0.0.0.0 --port 8100 --workers 1 \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8100/health && break; sleep 1; done || {
            echo "::error::the backend never became healthy on ${{ matrix.backend }}"
            cat /tmp/backend.log
            exit 1
          }
      - name: Confirm the backend is on the backend this leg is named for
        run: |
          # Without this the PostgreSQL leg would pass by silently falling back
          # to SQLite, which is the failure mode the job exists to rule out.
          reported=$(curl -sf http://localhost:8100/api/settings \
            | python -c 'import json,sys; print(json.load(sys.stdin)["environment"]["database_backend"])')
          echo "backend reports: $reported"
          case "${{ matrix.backend }}" in
            sqlite) [ "$reported" = "sqlite" ] ;;
            postgresql) [ "$reported" = "postgresql+psycopg" ] ;;
          esac || { echo "::error::expected ${{ matrix.backend }}, got $reported"; exit 1; }
      - name: Run Playwright e2e tests
        working-directory: web
        run: npm run test:e2e
      - name: Backend log
        if: failure()
        run: cat /tmp/backend.log
  rust-agent:
    name: Run node agent tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: agent
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: agent
      - name: Run Rust tests
        run: cargo test
        working-directory: agent

  agent-release-build:
    name: Build the node agent for a node
    # An aarch64 runner, so the build is *native*: the same compile takes 26
    # minutes under emulation on an x86_64 runner, which is too long to sit in
    # front of every merge. This is the only place the shipped artifact is
    # produced at all, so it runs on every change rather than only at release
    # time — a release path nothing exercises is one that breaks at a release.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache the agent build
        uses: actions/cache@v4
        with:
          path: .agent-build-cache
          key: agent-release-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: agent-release-
      - name: Build
        run: ./scripts/build-agent.sh
      - name: Check what came out
        run: |
          set -euo pipefail
          binary=spark_pulse/agent/bin/spark-pulse-agent-aarch64-unknown-linux-musl
          file "$binary"
          file "$binary" | grep -q "ARM aarch64"
          # "static-pie linked" is the other spelling `file` uses for a static
          # ELF; see the same check in release.yml.
          file "$binary" | grep -qE "statically linked|static-pie linked"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spark-pulse-agent-aarch64-unknown-linux-musl
          path: spark_pulse/agent/bin/spark-pulse-agent-*
          if-no-files-found: error

  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the linters to the versions in .pre-commit-config.yaml so CI
          # and the pre-commit hook agree on what "clean" means.
          pip install -e ".[dev]" "ruff==0.12.0" "black==25.1.0"
          cd web && npm ci && cd ..

      - name: Run Python linters
        run: |
          black --check --diff tests/ spark_pulse/
          ruff check tests/ spark_pulse/

      - name: Run frontend ESLint
        run: |
          cd web && npx eslint src/ && cd ..

      - name: Run TypeScript type check
        run: |
          cd web && npx tsc --noEmit && cd ..
