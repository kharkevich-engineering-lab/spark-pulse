name: Unit tests
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
jobs:
  unit-tests:
    name: Run Unit testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend build
        working-directory: web
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python tests
        run: |
          pytest --tb=short -v spark_plug/
