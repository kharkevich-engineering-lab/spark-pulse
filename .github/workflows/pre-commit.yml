name: Run pre-commit
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pytest ruff httpx
      - name: Run pre-commit
        run: |
          black --check --diff spark_pulse/ web/src/
          ruff check spark_pulse/ web/src/
          pytest --tb=short spark_pulse/
